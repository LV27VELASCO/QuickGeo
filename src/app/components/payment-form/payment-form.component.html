<form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()" class="space-y-6">
              <div class="space-y-4">
                <!-- Card Number -->
                <div>
                  <label for="card-number" class="block text-gray-700 font-medium mb-2">
                    Número de Tarjeta
                  </label>
                  <div class="relative">
                    <div id="card-number"
                      class="w-full px-4 py-3 bg-white/40 border border-green-900/30 rounded-xl text-gray-700 placeholder-gray-300  transition-all duration-300">
                    </div>
                  </div>
                </div>

                <!-- Expiry and CVV -->
                <div class="grid grid-cols-2 gap-4">
                  <div class="space-y-2">
                    <label for="card-expiry" class="block text-gray-700 font-medium mb-2">
                      F. Caducidad
                    </label>
                    <div id="card-expiry"
                      class="w-full px-4 py-3 bg-white/40 border border-green-900/30 rounded-xl text-gray-700 placeholder-gray-300  transition-all duration-300">
                    </div>
                  </div>

                  <div class="space-y-2">
                    <label for="card-cvc" class="block text-gray-700 font-medium mb-2">
                      CCV
                    </label>
                    <div id="card-cvc"
                      class="w-full px-4 py-3 bg-white/40 border border-green-900/30 rounded-xl text-gray-700 placeholder-gray-300  transition-all duration-300">
                    </div>
                  </div>
                </div>

                <!-- Cardholder Email -->
                <div>
                  <label for="card-name" class="block text-gray-700 font-medium mb-2">
                    Email
                  </label>
                  <input type="email" id="card-email" name="card-email" formControlName="email" placeholder="johndoe@example.com"
                    class="w-full px-4 py-[10px] bg-white/40 border border-green-900/30 outline-none rounded-xl text-gray-800 placeholder-gray-500  transition-all duration-300"
                    required />
                </div>

                <!-- Cardholder Name -->
                <div>
                  <label for="card-name" class="block text-gray-700 font-medium mb-2">
                    Nombre Titular
                  </label>
                  <input type="text" id="card-name" name="card-name" formControlName="name" placeholder="John Doe"
                    class="w-full px-4 py-[10px] bg-white/40 border border-green-900/30 outline-none rounded-xl text-gray-800 placeholder-gray-500  transition-all duration-300"
                    required />
                </div>
              </div>

              <!-- Checkbox -->
              <div class="flex items-start gap-3">
                <input type="checkbox" id="terms" formControlName="terms"
                  class="w-4 h-4 mt-1 border-gray-300 rounded text-green-600 focus:ring-green-500" required>
                <label for="terms" class="text-sm text-gray-600">
                  Acepto los <a href="/legals" class="text-green-600 hover:text-green-700 font-medium">términos de
                    servicio</a> y la <a href="/confidentiality" class="text-green-600 hover:text-green-700 font-medium">política de
                    privacidad</a>
                </label>
              </div>

              <div [class]="!resultado?'hidden':''" class="text-red-500/90 text-center text-sm bg-red-500/20 py-2 px-4 rounded-xl border border-red-400/30">{{resultado}}</div>
              <div [class]="!success?'hidden':''" class="text-green-500/90 text-center text-sm bg-green-500/20 py-2 px-4 rounded-xl border border-green-400/30">{{success}}</div>

              <!-- Submit Button -->
              <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition-all duration-200 flex items-center justify-center gap-2">
                <span id="buttonText">Pagar €0,50</span>
                <span id="loader" class="hidden loader"></span>
              </button>

              <!-- Security Info -->
              <div class="security-badge justify-center">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd"
                    d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                    clip-rule="evenodd"></path>
                </svg>
                Pago seguro con Stripe
              </div>
</form>
<div id="loaderModal" [class]="loader?'':'hidden opacity-0'"
    class="fixed inset-0 z-[70] flex items-center justify-center bg-black/30 backdrop-blur-sm transition-opacity duration-200"
    role="dialog" aria-modal="true" aria-labelledby="loaderTitle">
    <div class="mx-4 w-full max-w-sm rounded-2xl border border-white/20 bg-white/50 p-6 text-center shadow-xl">
        <div class="mx-auto mb-4 h-12 w-12 rounded-full border-4 border-green-400/80 border-t-transparent animate-spin">
        </div>
        <h2 id="loaderTitle" class="text-gray-700 text-lg font-semibold mb-1">
            Procesando...
        </h2>
        <p data-loader-text class="text-gray-700 text-sm">
            Este proceso puede tardar algunos minutos, por favor no recargue ni cierre esta ventana.
        </p>
    </div>
</div>
