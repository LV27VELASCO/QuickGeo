<section class=" min-h-dvh flex items-center justify-center p-4">
  <img src="assets/icons/Map.svg"
    class="absolute object-cover drop-shadow-sm inset-0 -z-10 size-full blur-sm [mask-image:radial-gradient(100%_100%_at_top_right,white,transparent)] stroke-gray-200"
    alt="Background Map">

  <div class="w-full max-w-md">
    <!-- Header con icono animado -->
    <div class="flex flex-col items-center mb-8">
      <div class="relative mb-6">
        <div class="absolute inset-0 bg-gradient-to-r from-green-500 to-emerald-600 rounded-full blur-lg opacity-40 pulse-glow">
        </div>
        <div class="relative bg-gradient-to-br from-green-500 to-emerald-600 p-4 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-8 text-white animateBouce">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.348 14.652a3.75 3.75 0 0 1 0-5.304m5.304 0a3.75 3.75 0 0 1 0 5.304m-7.425 2.121a6.75 6.75 0 0 1 0-9.546m9.546 0a6.75 6.75 0 0 1 0 9.546M5.106 18.894c-3.808-3.807-3.808-9.98 0-13.788m13.788 0c3.808 3.807 3.808 9.98 0 13.788M12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>

        </div>
      </div>
      <h1 class="text-2xl font-bold text-gray-700 text-center mb-2">Identificación de ubicación</h1>
      <p class="text-gray-500 text-sm text-center">Localizando tu posición...</p>
    </div>

    <!-- Card principal -->
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-lg backdrop-blur-sm">
      <!-- Steps -->
      <div class="space-y-4 mb-8">
        <!-- Step 1: Complete -->
        <div class="flex items-center gap-4">
          <div class="flex-shrink-0 mt-1">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
              <div *ngIf="isLoading1; else svg1">
                <svg class="w-4 h-4 text-white animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </div>
              <ng-template #svg1>
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </ng-template>
            </div>
          </div>
          <div [class]="isLoading1?'':'flex justify-between items-center'" class="flex-1 min-w-0">
            <p class="text-sm font-medium text-green-600">País</p>
            <div class="flex items-center">
              <div *ngIf="isLoading1; else content">
                <div class="mt-2 flex gap-1">
                  <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom"></div>
                  <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-100"></div>
                  <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-200"></div>
                </div>
              </div>
              <ng-template #content>
                <div class="flex items-center gap-1">
                  <div class="h-5 w-5 rounded-full">
                    <img class="h-full w-full rounded-full" src="https://flagcdn.com/{{dataPhone.flag}}.svg" alt="">
                  </div>
                  <p class="font-semibold text-sm text-gray-500">{{dataPhone.country}}</p>
                </div>
              </ng-template>
            </div>
          </div>
        </div>

        <!-- Step 2: Complete -->
        <div class="flex items-start gap-4">
          <div class="flex-shrink-0 mt-1">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
              <div *ngIf="isLoading2; else svg2">
                <svg class="w-4 h-4 text-white animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </div>
              <ng-template #svg2>
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </ng-template>
            </div>
          </div>

          <div [class]="isLoading2?'':'flex justify-between items-center'" class="flex-1 min-w-0">
            <p class="text-sm font-medium text-green-600">Operador</p>
            <div *ngIf="isLoading2; else content2">
              <div class="mt-2 flex gap-1">
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom"></div>
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-100"></div>
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-200"></div>
              </div>
            </div>
            <ng-template #content2>
              <div>
                <p class="font-semibold text-sm text-gray-500">{{dataPhone.operator}}</p>
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Step 3: Loading -->
        <div class="flex items-start gap-4">
          <div class="flex-shrink-0 mt-1">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
              <div *ngIf="isLoading3; else svg3">
                <svg class="w-4 h-4 text-white animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </div>
              <ng-template #svg3>
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </ng-template>
            </div>
          </div>
          <div [class]="isLoading3?'':'flex justify-between items-center'" class="flex-1 min-w-0">
            <p class="text-sm font-medium text-green-600">Conectando a torres celulares</p>
            <div *ngIf="isLoading3; else content3">
              <div class="mt-2 flex gap-1">
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom"></div>
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-100"></div>
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-200"></div>
              </div>
            </div>
            <ng-template #content3>
              <div class="h-6 w-6 rounded-full">
                <img class="h-full w-full rounded-full" src="./assets/icons/check.svg" alt="check">
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Step 4: Pending -->
        <div class="flex items-start gap-4">
          <div class="flex-shrink-0 mt-1">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
              <div *ngIf="isLoading4; else svg4">
                <svg class="w-4 h-4 text-white animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </div>
              <ng-template #svg4>
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </ng-template>
            </div>
          </div>
          <div [class]="isLoading4?'':'flex justify-between items-center'" class="flex-1 min-w-0">
            <p class="text-sm font-medium text-green-600">Intentando triangular la IP</p>
            <div *ngIf="isLoading4; else content4">
              <div class="mt-2 flex gap-1">
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom"></div>
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-100"></div>
                <div class="w-1 h-1 rounded-full bg-green-500 animate-bounce-custom delay-200"></div>
              </div>
            </div>
            <ng-template #content4>
              <div class="h-6 w-6 rounded-full">
                <img class="h-full w-full rounded-full" src="./assets/icons/check.svg" alt="check">
              </div>
            </ng-template>
          </div>
        </div>
      </div>

      <!-- Barra de progreso -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-medium text-gray-600">Progreso</span>
        </div>
        <div class="w-full rounded-full bg-gray-100 backdrop-blur-sm overflow-hidden">
            <div class="transition-all bg-gradient-to-r from-green-500 via-esmerald-600 to-esmerald-700 h-2 rounded-full animate-fill">

            </div>
        </div>
      </div>
    </div>

    <!-- Footer info -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-400">Este proceso es seguro y privado</p>
    </div>
  </div>
  </section>
